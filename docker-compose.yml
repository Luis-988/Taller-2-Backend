services:
  api:
    build: .
    expose:
      - "3000"
    networks:
      - netw
  
  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - netw
    depends_on:
      - api
networks:
  netw:
    driver: bridge